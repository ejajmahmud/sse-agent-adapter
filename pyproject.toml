[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-agent-adapter"
version = "0.1.0"
description = "Universal Server-Sent Events (SSE) streaming adapter standardizing token streams across LLM providers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
sse-agent-adapter = "sse_agent_adapter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sse_agent_adapter*"]
